<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; object-src 'none'"
    />
    <title>You're offline · Family Ledger</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf7f2;
        color: #1f1b16;
        font:
          18px/1.5 -apple-system,
          "SF Pro Text",
          system-ui,
          "Segoe UI",
          Roboto,
          sans-serif;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 26rem;
        background: #fff;
        border: 1px solid #e8e0d4;
        border-radius: 24px;
        padding: 32px 24px;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 16px 0 8px;
      }
      p {
        color: #6b6259;
        margin: 0 0 16px;
      }
      a {
        display: inline-block;
        min-height: 48px;
        line-height: 48px;
        padding: 0 24px;
        border-radius: 999px;
        background: #1f5f5b;
        color: #fff;
        text-decoration: none;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <svg width="64" height="64" viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" rx="112" fill="#1F5F5B" />
        <rect x="136" y="112" width="240" height="296" rx="28" fill="#FAF7F2" />
        <rect x="212" y="176" width="128" height="20" rx="10" fill="#1F5F5B" />
        <rect x="212" y="228" width="104" height="20" rx="10" fill="#9DB8A8" />
      </svg>
      <h1>You're offline</h1>
      <p>Family money details aren't stored on this phone for safety, so they'll appear again when you're connected.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
